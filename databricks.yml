bundle:
  name: finops-lakehouse

workspace:
  profile: dbc-629640cc-a841

targets:
  dev:
    default: true

resources:

  jobs:

    finops_end_to_end_pipeline:

      name: finops-end-to-end-pipeline

      job_clusters:

        - job_cluster_key: finops_cluster

          new_cluster:

            spark_version: 15.4.x-scala2.12

            node_type_id: Standard_DS3_v2

            num_workers: 1

      tasks:

        - task_key: bronze_ingestion

          job_cluster_key: finops_cluster

          notebook_task:
            notebook_path: notebooks/01_bronze_ingestion.py

        - task_key: silver_dimensions

          job_cluster_key: finops_cluster

          depends_on:
            - task_key: bronze_ingestion

          notebook_task:
            notebook_path: notebooks/02_silver_dimensions.py

        - task_key: silver_fact

          job_cluster_key: finops_cluster

          depends_on:
            - task_key: silver_dimensions

          notebook_task:
            notebook_path: notebooks/03_silver_dimensions.py

        - task_key: gold_layer

          job_cluster_key: finops_cluster

          depends_on:
            - task_key: silver_fact

          spark_python_task:
            python_file: notebooks/04_gold_layer.py